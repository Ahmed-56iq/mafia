<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حلبة الأساطير | تحدي المعرفة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#07061a;
  --bg2:#100e2e;
  --panel:#15123a;
  --panel-2:#1c1850;
  --line:rgba(139,92,246,.28);
  --violet:#8b5cf6;
  --violet-2:#c4b5fd;
  --gold:#ffc857;
  --gold-2:#ffe1a3;
  --teal:#2dd4bf;
  --danger:#ff4d6d;
  --text:#f3f1ff;
  --dim:#a79fd4;
  --easy:#2dd4bf;
  --med:#ffc857;
  --hard:#ff4d6d;
  --r:16px;
}
*{box-sizing:border-box; margin:0; padding:0;}
html,body{height:100%;}
body{
  font-family:'Tajawal',Tahoma,Arial,sans-serif;
  background:
    radial-gradient(ellipse 1200px 700px at 20% -10%, rgba(139,92,246,.25), transparent 60%),
    radial-gradient(ellipse 900px 700px at 100% 10%, rgba(45,212,191,.15), transparent 55%),
    radial-gradient(ellipse 1000px 900px at 50% 120%, rgba(255,200,87,.10), transparent 55%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
}
body::before{
  content:"";
  position:fixed; inset:0;
  background-image:
    radial-gradient(2px 2px at 15% 25%, rgba(255,255,255,.5), transparent),
    radial-gradient(2px 2px at 75% 15%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 45% 60%, rgba(255,255,255,.35), transparent),
    radial-gradient(2px 2px at 85% 75%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 25% 85%, rgba(255,255,255,.3), transparent),
    radial-gradient(2px 2px at 60% 40%, rgba(255,255,255,.3), transparent);
  background-size: 100% 100%;
  opacity:.6;
  pointer-events:none;
  z-index:0;
}
#app{position:relative; z-index:1; max-width:1280px; margin:0 auto; padding:22px 18px 60px;}

/* ---------- Header brand ---------- */
.brand{
  display:flex; align-items:center; justify-content:center; gap:14px;
  margin-bottom:26px; text-align:center; flex-direction:column;
}
.brand h1{
  font-family:'Cairo',Tahoma,sans-serif;
  font-weight:900;
  font-size:clamp(28px,5vw,46px);
  letter-spacing:1px;
  background:linear-gradient(90deg,var(--gold),var(--violet-2) 55%,var(--teal));
  -webkit-background-clip:text; background-clip:text; color:transparent;
  filter:drop-shadow(0 0 22px rgba(139,92,246,.45));
}
.brand p{color:var(--dim); font-size:14px; letter-spacing:.5px;}

/* ---------- Cards / panels ---------- */
.panel{
  background:linear-gradient(180deg, var(--panel), var(--bg2));
  border:1px solid var(--line);
  border-radius:var(--r);
  padding:24px;
  box-shadow:0 10px 40px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.04);
}
.step-badge{
  display:inline-flex; align-items:center; gap:8px;
  font-family:'Cairo',sans-serif; font-weight:800; font-size:13px;
  color:var(--gold); background:rgba(255,200,87,.1); border:1px solid rgba(255,200,87,.35);
  padding:5px 14px; border-radius:999px; margin-bottom:14px;
}
.section-title{
  font-family:'Cairo',sans-serif; font-weight:800; font-size:22px; margin-bottom:4px;
}
.section-sub{color:var(--dim); font-size:13.5px; margin-bottom:18px;}

/* ---------- Buttons ---------- */
.btn{
  font-family:'Cairo',sans-serif; font-weight:700; font-size:15px;
  border:none; cursor:pointer; border-radius:12px; padding:13px 26px;
  transition:transform .15s ease, box-shadow .15s ease, opacity .15s ease;
  color:var(--text); position:relative;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.35; cursor:not-allowed;}
.btn-primary{
  background:linear-gradient(135deg,var(--violet),#5b3bd6);
  box-shadow:0 8px 24px rgba(139,92,246,.4);
}
.btn-primary:not(:disabled):hover{box-shadow:0 10px 30px rgba(139,92,246,.6); transform:translateY(-2px);}
.btn-gold{
  background:linear-gradient(135deg,var(--gold),#e8a530); color:#231400;
  box-shadow:0 8px 24px rgba(255,200,87,.35);
}
.btn-gold:not(:disabled):hover{box-shadow:0 10px 30px rgba(255,200,87,.55); transform:translateY(-2px);}
.btn-ghost{
  background:rgba(255,255,255,.05); border:1px solid var(--line);
}
.btn-ghost:not(:disabled):hover{background:rgba(255,255,255,.1);}
.btn-sm{padding:8px 14px; font-size:13px; border-radius:9px;}

/* ---------- Setup: teams ---------- */
.team-row{
  display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px;
  background:rgba(255,255,255,.03); border:1px solid var(--line); margin-bottom:10px;
}
.team-dot{width:14px; height:14px; border-radius:50%; flex-shrink:0; box-shadow:0 0 12px currentColor;}
.team-row input[type=text]{
  flex:1; background:transparent; border:none; outline:none; color:var(--text);
  font-family:'Tajawal',sans-serif; font-weight:700; font-size:15px;
}
.team-row .remove-team{color:var(--danger); background:none; border:none; cursor:pointer; font-size:18px; padding:4px 8px;}
.teams-controls{display:flex; gap:10px; margin-top:14px; flex-wrap:wrap;}

/* ---------- Setup: categories ---------- */
.cat-counter{
  display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; flex-wrap:wrap; gap:10px;
}
.cat-counter .count{font-family:'Cairo',sans-serif; font-weight:800; color:var(--gold);}
.cat-grid{
  display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px;
}
.cat-chip{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
  padding:14px 8px; border-radius:14px; cursor:pointer; text-align:center;
  background:rgba(255,255,255,.03); border:1.5px solid var(--line);
  transition:all .15s ease; user-select:none;
}
.cat-chip .ic{font-size:24px;}
.cat-chip .nm{font-size:12.5px; font-weight:700; line-height:1.3;}
.cat-chip.sel{
  background:linear-gradient(150deg, rgba(139,92,246,.28), rgba(45,212,191,.14));
  border-color:var(--violet-2); box-shadow:0 0 18px rgba(139,92,246,.35);
}
.cat-chip.blocked{opacity:.3; cursor:not-allowed; pointer-events:none;}
.wizard-nav{display:flex; justify-content:space-between; margin-top:22px; gap:10px;}

/* ---------- Setup: question counts ---------- */
.count-rows{display:flex; flex-direction:column; gap:10px;}
.count-row{
  display:flex; align-items:center; justify-content:space-between; padding:14px 16px; border-radius:14px;
  border:1.5px solid var(--line); background:rgba(255,255,255,.03);
}
.count-row.easy{border-color:rgba(45,212,191,.4);}
.count-row.medium{border-color:rgba(255,200,87,.4);}
.count-row.hard{border-color:rgba(255,77,109,.4);}
.count-row .cr-label{font-family:'Cairo',sans-serif; font-weight:800; font-size:15px;}
.count-row.easy .cr-label{color:var(--easy);}
.count-row.medium .cr-label{color:var(--gold);}
.count-row.hard .cr-label{color:var(--hard);}
.count-row .cr-pts{font-weight:600; font-size:12px; color:var(--dim);}
.count-row .cr-stepper{display:flex; align-items:center; gap:12px;}
.count-row .cr-stepper button{padding:6px 14px; font-size:16px; line-height:1;}
input.cr-val{
  font-family:'Cairo',sans-serif; font-weight:900; font-size:18px; text-align:center;
  width:56px; padding:6px 4px; border-radius:8px; border:1.5px solid var(--line);
  background:rgba(255,255,255,.06); color:var(--text); -moz-appearance:textfield;
}
input.cr-val::-webkit-outer-spin-button, input.cr-val::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
input.cr-val:focus{outline:none; border-color:var(--violet-2); box-shadow:0 0 0 3px rgba(139,92,246,.25);}

/* ---------- Scoreboard ---------- */
.scoreboard{
  display:flex; gap:10px; flex-wrap:wrap; margin-bottom:18px;
}
.score-card{
  flex:1; min-width:130px; padding:12px 14px; border-radius:14px;
  background:rgba(255,255,255,.03); border:1.5px solid var(--line);
  transition:all .2s ease;
}
.score-card.active{
  border-color:var(--gold); box-shadow:0 0 22px rgba(255,200,87,.4);
  background:linear-gradient(150deg, rgba(255,200,87,.14), rgba(255,255,255,.03));
}
.score-card .nm{font-size:12.5px; color:var(--dim); font-weight:700; display:flex; align-items:center; gap:6px;}
.score-card .pt{font-family:'Cairo',sans-serif; font-weight:900; font-size:24px; margin-top:2px;}
.turn-banner{
  text-align:center; font-family:'Cairo',sans-serif; font-weight:800; font-size:15px;
  color:var(--bg); background:linear-gradient(90deg,var(--gold),var(--gold-2));
  padding:10px; border-radius:12px; margin-bottom:18px; box-shadow:0 6px 20px rgba(255,200,87,.35);
  animation:pulseTurn 2s ease-in-out infinite;
}
@keyframes pulseTurn{0%,100%{opacity:1;} 50%{opacity:.82;}}

/* ---------- Board ---------- */
.board-wrap{overflow-x:auto; padding-bottom:8px;}
.board{display:grid; gap:8px; min-width:max-content;}
.board-cat-header{
  font-family:'Cairo',sans-serif; font-weight:800; font-size:12.5px; text-align:center;
  padding:10px 6px; border-radius:10px; width:128px;
  background:linear-gradient(150deg, rgba(139,92,246,.22), rgba(139,92,246,.06));
  border:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:4px;
}
.board-cat-header .ic{font-size:20px;}
.cell{
  width:128px; height:78px; border-radius:12px; cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border:1.5px solid var(--line); position:relative; overflow:hidden;
  font-family:'Cairo',sans-serif; transition:all .15s ease;
  clip-path:polygon(10% 0,90% 0,100% 25%,100% 75%,90% 100%,10% 100%,0 75%,0 25%);
}
.cell .pts{font-weight:900; font-size:20px;}
.cell .lvl{font-size:10.5px; font-weight:700; opacity:.85;}
.cell.easy{background:linear-gradient(150deg, rgba(45,212,191,.22), rgba(45,212,191,.05)); color:var(--easy); border-color:rgba(45,212,191,.45);}
.cell.medium{background:linear-gradient(150deg, rgba(255,200,87,.22), rgba(255,200,87,.05)); color:var(--gold); border-color:rgba(255,200,87,.45);}
.cell.hard{background:linear-gradient(150deg, rgba(255,77,109,.22), rgba(255,77,109,.05)); color:var(--hard); border-color:rgba(255,77,109,.45);}
.cell:not(.used):hover{transform:translateY(-3px) scale(1.03); box-shadow:0 10px 24px rgba(0,0,0,.4);}
.cell.used{
  cursor:default; opacity:.35; color:var(--dim);
  background:rgba(255,255,255,.02); border-color:var(--line);
}
.cell.used .delta{font-weight:900; font-size:16px;}

/* ---------- Level picker (replaces category grid) ---------- */
.level-picker{display:flex; gap:14px; flex-wrap:wrap; margin-bottom:18px;}
.level-card{
  flex:1; min-width:150px; padding:22px 14px; border-radius:18px; cursor:pointer; text-align:center;
  border:1.5px solid var(--line); transition:all .18s ease; position:relative; overflow:hidden;
}
.level-card .lc-label{font-family:'Cairo',sans-serif; font-weight:900; font-size:19px; margin-bottom:4px;}
.level-card .lc-pts{font-family:'Cairo',sans-serif; font-weight:800; font-size:14px; opacity:.9; margin-bottom:2px;}
.level-card .lc-time{font-size:12px; opacity:.75; margin-bottom:8px;}
.level-card .lc-remaining{font-size:12.5px; font-weight:700; opacity:.9;}
.level-card.easy{background:linear-gradient(160deg, rgba(45,212,191,.22), rgba(45,212,191,.05)); color:var(--easy); border-color:rgba(45,212,191,.45);}
.level-card.medium{background:linear-gradient(160deg, rgba(255,200,87,.22), rgba(255,200,87,.05)); color:var(--gold); border-color:rgba(255,200,87,.45);}
.level-card.hard{background:linear-gradient(160deg, rgba(255,77,109,.22), rgba(255,77,109,.05)); color:var(--hard); border-color:rgba(255,77,109,.45);}
.level-card:not(.done):hover{transform:translateY(-4px) scale(1.02); box-shadow:0 12px 30px rgba(0,0,0,.4);}
.level-card.done{cursor:default; opacity:.35; color:var(--dim); background:rgba(255,255,255,.02); border-color:var(--line);}

.history-wrap{margin-bottom:16px;}
.history-title{font-family:'Cairo',sans-serif; font-weight:800; font-size:12.5px; color:var(--dim); margin-bottom:8px;}
.history-row{display:flex; gap:8px; flex-wrap:wrap;}
.history-chip{
  display:flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px; font-size:12px;
  font-weight:700; border:1px solid var(--line); background:rgba(255,255,255,.04);
}
.history-chip.good{border-color:var(--teal); color:var(--teal);}
.history-chip.bad{border-color:var(--danger); color:var(--danger);}
.history-chip.neutral{border-color:var(--dim); color:var(--dim);}

.opt-tf{justify-content:center; font-size:16px; font-weight:800;}
.tf-lab{font-size:16px; background:transparent; width:auto; height:auto;}

/* ---------- Modal ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(4,3,15,.82); backdrop-filter:blur(6px);
  display:flex; align-items:center; justify-content:center; z-index:50; padding:16px;
  animation:fadeIn .2s ease;
}
@keyframes fadeIn{from{opacity:0;} to{opacity:1;}}
.gate{
  width:100%; max-width:640px; max-height:92vh; overflow-y:auto;
  background:linear-gradient(180deg, var(--panel-2), var(--bg2));
  border:1.5px solid var(--violet-2);
  border-radius:26px;
  clip-path:polygon(4% 0,96% 0,100% 6%,100% 94%,96% 100%,4% 100%,0 94%,0 6%);
  box-shadow:0 0 0 1px rgba(139,92,246,.15), 0 30px 80px rgba(0,0,0,.6), 0 0 60px rgba(139,92,246,.25);
  padding:26px 24px 22px;
  animation:riseIn .25s cubic-bezier(.2,.9,.3,1.2);
}
@keyframes riseIn{from{opacity:0; transform:translateY(24px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);}}
.gate-head{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:14px; flex-wrap:wrap;}
.gate-tag{
  font-family:'Cairo',sans-serif; font-weight:800; font-size:13px; padding:6px 14px; border-radius:999px;
}
.gate-tag.easy{background:rgba(45,212,191,.18); color:var(--easy); border:1px solid rgba(45,212,191,.4);}
.gate-tag.medium{background:rgba(255,200,87,.18); color:var(--gold); border:1px solid rgba(255,200,87,.4);}
.gate-tag.hard{background:rgba(255,77,109,.18); color:var(--hard); border:1px solid rgba(255,77,109,.4);}
.gate-team{font-family:'Cairo',sans-serif; font-weight:800; font-size:13.5px; color:var(--dim);}
.gate-team b{color:var(--text);}

.timer-row{display:flex; align-items:center; gap:10px; margin-bottom:14px;}
.timer-track{flex:1; height:9px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; border:1px solid var(--line);}
.timer-fill{height:100%; border-radius:999px; transition:width 1s linear, background .3s ease; background:linear-gradient(90deg,var(--teal),var(--gold));}
.timer-row.medium .timer-fill{background:linear-gradient(90deg,var(--gold),#ffdd8a);}
.timer-row.hard .timer-fill{background:linear-gradient(90deg,var(--hard),#ff8aa0);}
.timer-fill.urgent{background:var(--danger) !important; animation:timerPulse .6s ease-in-out infinite;}
@keyframes timerPulse{0%,100%{opacity:1;} 50%{opacity:.55;}}
.timer-num{font-family:'Cairo',sans-serif; font-weight:800; font-size:14px; min-width:26px; text-align:center; color:var(--dim);}
.timer-num.urgent{color:var(--danger); animation:timerPulse .6s ease-in-out infinite;}
.lifelines{display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap;}
.life-btn{
  flex:1; min-width:100px; display:flex; align-items:center; justify-content:center; gap:6px;
  padding:10px 8px; border-radius:12px; border:1.5px solid var(--line); background:rgba(255,255,255,.04);
  cursor:pointer; font-family:'Cairo',sans-serif; font-weight:700; font-size:12.5px; color:var(--text);
  transition:all .15s ease;
}
.life-btn:hover:not(:disabled){border-color:var(--teal); box-shadow:0 0 16px rgba(45,212,191,.3);}
.life-btn:disabled{opacity:.3; cursor:not-allowed;}
.life-btn .ic{font-size:16px;}

.qtext{
  font-family:'Cairo',sans-serif; font-weight:700; font-size:19px; line-height:1.6;
  margin-bottom:18px; padding:16px; border-radius:14px;
  background:rgba(0,0,0,.2); border:1px solid var(--line); min-height:60px;
}
.options{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px;}
@media(max-width:480px){.options{grid-template-columns:1fr;}}
.opt{
  padding:14px 12px; border-radius:12px; border:1.5px solid var(--line); background:rgba(255,255,255,.04);
  cursor:pointer; text-align:right; font-size:14.5px; font-weight:600; transition:all .15s ease;
  display:flex; align-items:center; gap:8px;
}
.opt .lab{
  width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,.08); flex-shrink:0;
  display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800; font-family:'Cairo',sans-serif;
}
.opt:hover:not(.disabled):not(.answered){border-color:var(--violet-2); background:rgba(139,92,246,.12);}
.opt.hidden50{opacity:.12; pointer-events:none;}
.opt.correct-reveal{background:rgba(45,212,191,.22); border-color:var(--teal); color:var(--teal);}
.opt.wrong-reveal{background:rgba(255,77,109,.2); border-color:var(--danger); color:var(--danger);}
.opt.disabled{pointer-events:none;}

.hint-box, .ai-box{
  margin-bottom:14px; padding:12px 14px; border-radius:12px; font-size:13.5px; line-height:1.6;
  background:rgba(255,200,87,.08); border:1px solid rgba(255,200,87,.3); color:var(--gold-2);
  animation:fadeIn .25s ease;
}
.ai-box{background:rgba(139,92,246,.1); border-color:rgba(139,92,246,.4); color:var(--violet-2);}
.loader{display:flex; align-items:center; gap:10px; color:var(--dim); font-size:13.5px; padding:6px 2px;}
.spin{width:16px; height:16px; border-radius:50%; border:2.5px solid rgba(255,255,255,.15); border-top-color:var(--gold); animation:sp .7s linear infinite;}
@keyframes sp{to{transform:rotate(360deg);}}

.result-strip{
  display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px; margin-bottom:6px;
  padding:14px; border-radius:14px; font-family:'Cairo',sans-serif; font-weight:800; animation:fadeIn .3s ease;
}
.result-strip.good{background:rgba(45,212,191,.16); border:1px solid var(--teal); color:var(--teal);}
.result-strip.bad{background:rgba(255,77,109,.16); border:1px solid var(--danger); color:var(--danger);}
.gate-actions{display:flex; justify-content:flex-end; gap:10px; margin-top:8px;}
.err-box{
  padding:14px; border-radius:12px; background:rgba(255,77,109,.12); border:1px solid var(--danger);
  color:#ffb8c4; font-size:13.5px; margin-bottom:14px;
}

/* ---------- End screen ---------- */
.podium{display:flex; align-items:flex-end; justify-content:center; gap:14px; margin:26px 0 10px; flex-wrap:wrap;}
.pod{
  width:150px; border-radius:16px 16px 0 0; padding:16px 10px; text-align:center;
  background:linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
  border:1.5px solid var(--line); border-bottom:none;
}
.pod .crown{font-size:30px;}
.pod .nm{font-family:'Cairo',sans-serif; font-weight:800; font-size:14px; margin-top:6px;}
.pod .sc{font-family:'Cairo',sans-serif; font-weight:900; font-size:22px; color:var(--gold); margin-top:4px;}
.pod.p1{height:190px; border-color:var(--gold); box-shadow:0 0 30px rgba(255,200,87,.35); order:2;}
.pod.p2{height:150px; order:1;}
.pod.p3{height:120px; order:3;}
.rank-row{
  display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-radius:12px;
  background:rgba(255,255,255,.03); border:1px solid var(--line); margin-bottom:8px;
}
.rank-row .l{display:flex; align-items:center; gap:10px; font-weight:700;}

footer.hint-foot{text-align:center; color:var(--dim); font-size:12px; margin-top:26px;}
.hidden{display:none !important;}

/* ---------- Mobile compaction: fit gameplay on small screens with minimal scrolling ---------- */
@media(max-width:600px){
  #app{padding:12px 10px 30px;}
  .brand{margin-bottom:14px; gap:6px;}
  .brand h1{font-size:22px;}
  .brand p{font-size:11.5px;}
  .panel{padding:14px;}
  .section-title{font-size:17px;}
  .section-sub{font-size:12px; margin-bottom:12px;}
  .step-badge{font-size:11px; padding:4px 10px; margin-bottom:10px;}
  .scoreboard{gap:6px; margin-bottom:10px;}
  .score-card{padding:8px 10px; min-width:92px;}
  .score-card .nm{font-size:11px;}
  .score-card .pt{font-size:18px;}
  .turn-banner{font-size:12.5px; padding:8px; margin-bottom:10px;}

let state = {
  screen:'setupTeams', // setupTeams | setupCats | setupCounts | board | end
  teams:[{name:'الفريق الأول', score:0},{name:'الفريق الثاني', score:0}],
  selectedCats:[],

  history:[],

};

function el(html){ const t=document.createElement('template'); t.innerHTML=html.trim(); return t.content.firstElementChild; }
function render(){
  const app=document.getElementById('app');
  app.innerHTML='';
  app.appendChild(brandHeader());
  if(state.screen==='setupTeams') app.appendChild(renderSetupTeams());
  else if(state.screen==='setupCats') app.appendChild(renderSetupCats());
  else if(state.screen==='setupCounts') app.appendChild(renderSetupCounts());
  else if(state.screen==='board') app.appendChild(renderBoardScreen());
  else if(state.screen==='end') app.appendChild(renderEnd());
  if(state.modal) app.appendChild(renderModal());
}

function brandHeader(){
  return el(`<div class="brand">
    <h1>🏆 حلبة الأساطير</h1>
    <p>تحدي المعرفة الكبير — نافس، أجب، وتوّج بطلاً</p>
  </div>`);
}

/* ============================ SETUP: TEAMS ============================ */
function renderSetupTeams(){
  const wrap=el(`<div class="panel">
    <div class="step-badge">الخطوة ١ من ٣</div>
    <div class="section-title">🛡️ تشكيل الفرق</div>
    <div class="section-sub">أضف فريقين على الأقل وامنح كل فريق اسماً يليق بالمنافسة</div>
    <div id="teamList"></div>
    <div class="teams-controls">
      <button class="btn btn-ghost btn-sm" id="addTeam">➕ إضافة فريق</button>
    </div>
    <div class="wizard-nav">
      <span></span>
      <button class="btn btn-primary" id="nextStep">التالي: اختيار الفئات ←</button>
    </div>
  </div>`);
  const list=wrap.querySelector('#teamList');
  state.teams.forEach((tm,i)=>{
    const row=el(`<div class="team-row">
      <span class="team-dot" style="color:${TEAM_COLORS[i%TEAM_COLORS.length]}; background:${TEAM_COLORS[i%TEAM_COLORS.length]}"></span>
      <input type="text" maxlength="24" value="${escapeHtml(tm.name)}" placeholder="اسم الفريق">
      ${state.teams.length>2?'<button class="remove-team" title="حذف">✕</button>':''}
    </div>`);
    row.querySelector('input').addEventListener('input',e=>{ state.teams[i].name=e.target.value; });
    const rm=row.querySelector('.remove-team');
    if(rm) rm.addEventListener('click',()=>{ state.teams.splice(i,1); render(); });
    list.appendChild(row);
  });
  wrap.querySelector('#addTeam').addEventListener('click',()=>{
    if(state.teams.length>=8) return;
    state.teams.push({name:'فريق '+(state.teams.length+1), score:0});
    render();
  });
  wrap.querySelector('#nextStep').addEventListener('click',()=>{
    state.teams.forEach(t=>{ if(!t.name.trim()) t.name='فريق بلا اسم'; });
    state.screen='setupCats'; render();
  });
  return wrap;
}

      <button class="btn btn-ghost btn-sm" id="clearCats">مسح الاختيار</button>
    </div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="wizard-nav">
      <button class="btn btn-ghost" id="backStep">→ رجوع</button>
      <button class="btn btn-gold" id="nextStep2" ${state.selectedCats.length<MIN_CATS?'disabled':''}>التالي: عدد الأسئلة ←</button>
    </div>
  </div>`);
  const grid=wrap.querySelector('#catGrid');
  CATEGORIES.forEach(c=>{
    const sel=state.selectedCats.includes(c.id);
    const blocked = atMax && !sel;
    const chip=el(`<div class="cat-chip ${sel?'sel':''} ${blocked?'blocked':''}"><span class="ic">${c.icon}</span><span class="nm">${c.name}</span></div>`);
    chip.addEventListener('click',()=>{
      const idx=state.selectedCats.indexOf(c.id);
      if(idx>-1){ state.selectedCats.splice(idx,1); }
      else{
        if(state.selectedCats.length>=MAX_CATS) return;
        state.selectedCats.push(c.id);
      }
      render();
    });
    grid.appendChild(chip);
  });
  wrap.querySelector('#clearCats').addEventListener('click',()=>{ state.selectedCats=[]; render(); });
  wrap.querySelector('#backStep').addEventListener('click',()=>{ state.screen='setupTeams'; render(); });
  wrap.querySelector('#nextStep2').addEventListener('click',()=>{
    if(state.selectedCats.length<MIN_CATS || state.selectedCats.length>MAX_CATS) return;
    state.screen='setupCounts'; render();
  });
  return wrap;
}

/* ============================ SETUP: QUESTION COUNTS PER TEAM ============================ */
const COUNT_MIN = 1;
const COUNT_MAX = 50;
function renderSetupCounts(){
  const wrap=el(`<div class="panel">
    <div class="step-badge">الخطوة ٣ من ٣</div>
    <div class="section-title">🎯 عدد الأسئلة لكل فريق</div>
    <div class="section-sub">كل فريق يحصل على هذا العدد بالضبط من الأسئلة لكل مستوى (مثال: لو حددت ١٠ صعب، فكل فريق يجيب ١٠ أسئلة صعبة) — يمكنك التعديل يدوياً بالكتابة مباشرة أو بأزرار +/−</div>
    <div class="count-rows" id="countRows"></div>
    <div class="wizard-nav">
      <button class="btn btn-ghost" id="backStep">→ رجوع</button>
      <button class="btn btn-gold" id="startGame">ابدأ اللعبة 🚀</button>
    </div>
  </div>`);
  const rows=wrap.querySelector('#countRows');
  LEVELS.forEach(level=>{
    const row=el(`<div class="count-row ${level.id}">
      <div class="cr-label">${level.label} <span class="cr-pts">(${level.pts} نقاط · ${level.time} ث)</span></div>
      <div class="cr-stepper">
        <button class="btn btn-ghost btn-sm cr-dec">−</button>
        <input type="number" class="cr-val" inputmode="numeric" min="${COUNT_MIN}" max="${COUNT_MAX}" value="${state.questionCounts[level.id]}">
        <button class="btn btn-ghost btn-sm cr-inc">+</button>
      </div>
    </div>`);
    const input = row.querySelector('.cr-val');
    function clamp(v){
      v = parseInt(v, 10);
      if(isNaN(v)) v = COUNT_MIN;
      return Math.max(COUNT_MIN, Math.min(COUNT_MAX, v));
    }
    row.querySelector('.cr-dec').addEventListener('click',()=>{
      state.questionCounts[level.id] = clamp(state.questionCounts[level.id]-1);
      render();
    });
    row.querySelector('.cr-inc').addEventListener('click',()=>{
      state.questionCounts[level.id] = clamp(state.questionCounts[level.id]+1);
      render();
    });
    input.addEventListener('input',()=>{
      state.questionCounts[level.id] = input.value==='' ? '' : parseInt(input.value,10);
    });
    input.addEventListener('blur',()=>{
      state.questionCounts[level.id] = clamp(input.value);
      render();
    });
    input.addEventListener('keydown',(e)=>{
      if(e.key==='Enter'){ input.blur(); }
    });
    rows.appendChild(row);
  });
  wrap.querySelector('#backStep').addEventListener('click',()=>{ state.screen='setupCats'; render(); });
  wrap.querySelector('#startGame').addEventListener('click',()=>{
    LEVELS.forEach(level=>{
      const v = parseInt(state.questionCounts[level.id],10);
      state.questionCounts[level.id] = isNaN(v) ? COUNT_MIN : Math.max(COUNT_MIN, Math.min(COUNT_MAX, v));
    });
    initGame();
    state.screen='board'; state.turn=0; render();
  });
  return wrap;
}

function initGame(){
  state.usedQuestionsByCat={};
  state.usedTextsByLevel={easy:[], medium:[], hard:[]};
  state.history=[];
  state.selectedCats.forEach(cid=>{ state.usedQuestionsByCat[cid]=[]; });
  state.teams.forEach(t=>{
    t.score=0;
    t.life={ai:false, fifty:false, hint:false};
    t.remaining={ easy:state.questionCounts.easy, medium:state.questionCounts.medium, hard:state.questionCounts.hard };
  });
}

/* ============================ QUESTION SOURCE ============================ */
/* The board always works instantly from the built-in local question bank
   (no internet or API access required). If this file happens to be running
   inside a Claude.ai artifact preview with live model access, we also try a
   short, silent live call first for extra variety — but we never block or
   show an error on it failing; the local bank is always the guaranteed path. */
async function tryLiveQuestion(catId, levelId){
  const cat = CATEGORIES.find(c=>c.id===catId);
  const level = LEVELS.find(l=>l.id===levelId);
  const diffAr = level.id==='easy'?'سهل':(level.id==='medium'?'متوسط':'صعب');
  const exclude = state.usedQuestionsByCat[catId] || [];
  const system = `أنت مولّد أسئلة لعبة تريفيا تنافسية باللغة العربية الفصحى الواضحة. أعد الرد بصيغة JSON صِرف فقط، دون أي نص إضافي أو رموز markdown، وبالضبط بالشكل التالي:
{"question":"نص السؤال","options":["خيار أ","خيار ب","خيار ج","خيار د"],"correct_index":0,"hint":"تلميح قصير يساعد دون ذكر الإجابة مباشرة"}
اجعل السؤال دقيقاً وصحيحاً ومناسباً لمستوى الصعوبة (سهل=معروف للعموم، متوسط=يحتاج معرفة جيدة، صعب=يحتاج معرفة متخصصة)، والخيارات منطقية ومتقاربة مع خيار واحد صحيح فقط. لا تكرر أي سؤال في قائمة الاستبعاد.`;
  const user = `الفئة: ${cat.name}
مستوى الصعوبة: ${diffAr}
${exclude.length? 'تجنب تكرار هذه الأسئلة أو ما يشابهها: '+exclude.join(' | ') : ''}`;
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 6000);
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      signal: controller.signal,
      body:JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:700, system, messages:[{role:"user", content:user}] })
    });
    clearTimeout(timeout);
    const data = await res.json();
    if(!data || !data.content) return null;
    let t = data.content.map(b=>b.text||'').join('\n').trim();
    t = t.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const start=t.indexOf('{'); const end=t.lastIndexOf('}');
    if(start>-1 && end>-1) t = t.substring(start, end+1);
    const parsed = JSON.parse(t);
    if(!parsed.question || !Array.isArray(parsed.options) || parsed.options.length!==4 || typeof parsed.correct_index!=='number') return null;
    return parsed;
  }catch(err){
    clearTimeout(timeout);
    return null; // silently fall back to the local bank — this is expected outside the chat preview
  }
}

function candidatesForLevel(levelId){
  const used = state.usedTextsByLevel[levelId] || [];
  const cands = [];
  state.selectedCats.forEach(cid=>{
    const list = QUESTION_BANK[cid] && QUESTION_BANK[cid][levelId];
    if(!list) return;
    list.forEach(q=>{
      if(!used.includes(q.question)) cands.push({catId:cid, question:q});
    });
  });
  return cands;
}
function pickLocalQuestionForLevel(levelId){
  let cands = candidatesForLevel(levelId);
  if(!cands.length){
    // every unique question for this level has been shown at least once — start a fresh cycle
    state.usedTextsByLevel[levelId] = [];
    cands = candidatesForLevel(levelId);
  }
  if(!cands.length) return null;
  const pick = cands[Math.floor(Math.random()*cands.length)];
  return { catId: pick.catId, question: JSON.parse(JSON.stringify(pick.question)) };
}

async function generateQuestion(catId, levelId){
  const live = await tryLiveQuestion(catId, levelId);
  if(live) return { catId, question: live };
  return pickLocalQuestionForLevel(levelId);
}

function localAiHelp(question){
  const correctText = question.options[question.correct_index];
  const templates = [
    `أعتقد أن الإجابة الأقرب للصواب هي "${correctText}" — هذا ما يتوافق مع المعلومات المعروفة حول هذا الموضوع.`,
    `بحسب معرفتي، الخيار الصحيح هو "${correctText}". جرّبه بثقة!`,
    `أميل بقوة إلى أن الجواب هو "${correctText}"، فهو الأكثر توافقاً مع الحقائق المتعلقة بالسؤال.`,
  ];
  return templates[Math.floor(Math.random()*templates.length)];
}

async function getAiHelpText(question){
  const system = `أنت صديق يتصل هاتفياً لمساعدة أحد المتسابقين في لعبة تريفيا. لديك السؤال والخيارات والإجابة الصحيحة. قدّم رداً قصيراً وودوداً (٢ إلى ٣ جمل) باللهجة الفصحى المبسطة، تُرشد فيه المتسابق نحو الإجابة الصحيحة مع سبب موجز، دون صياغة رسمية أو مقدمات، ابدأ الرد مباشرة بالمساعدة.`;
  const user = `السؤال: ${question.question}
الخيارات: ${question.options.map((o,i)=>OPT_LABELS[i]+') '+o).join(' — ')}
الإجابة الصحيحة هي: ${OPT_LABELS[question.correct_index]}) ${question.options[question.correct_index]}
قدّم مساعدتك الآن للمتسابق.`;
  const controller = new AbortController();
  const timeout = setTimeout(()=>controller.abort(), 6000);
  try{
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method:"POST", headers:{"Content-Type":"application/json"}, signal: controller.signal,
      body:JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:300, system, messages:[{role:"user", content:user}] })
    });
    clearTimeout(timeout);
    const data = await res.json();
    if(data && data.content){
      const txt = data.content.map(b=>b.text||'').join('\n').trim();
      if(txt) return txt;
    }
  }catch(err){ /* fall back below */ }
  return localAiHelp(question);
}

/* ============================ QUESTION MODAL ============================ */
function openQuestion(levelId){
  state.modal={ catId:null, levelId, question:null, loading:true, error:null,
    lifelinesUsed:{ai:false, fifty:false, hint:false}, hiddenOpts:[], hintText:null, aiText:null,
    answered:false, chosenIdx:null };
  render();
  loadQuestion();
}
function shuffleQuestionOptions(q){
  const idxArr = q.options.map((_,i)=>i);
  shuffleArr(idxArr);
  const newOptions = idxArr.map(i=>q.options[i]);
  const newCorrectIndex = idxArr.indexOf(q.correct_index);
  return { question:q.question, options:newOptions, correct_index:newCorrectIndex, hint:q.hint };
}

async function loadQuestion(){
  try{
    const levelId = state.modal.levelId;
    const flavorCat = randomCategory();
    const result = await generateQuestion(flavorCat, levelId);
    if(!result || !result.question) throw new Error('لا يتوفر سؤال');
    const q = shuffleQuestionOptions(result.question);
    state.modal.catId = result.catId;
    state.modal.question=q;
    state.modal.loading=false;
    const lvl = LEVELS.find(l=>l.id===levelId);
    state.modal.timeLeft = lvl.time;
    state.modal.timedOut = false;
    if(!state.usedTextsByLevel[levelId].includes(q.question)) state.usedTextsByLevel[levelId].push(q.question);
    const arr=state.usedQuestionsByCat[result.catId];
    if(arr){ arr.push(q.question); if(arr.length>6) arr.shift(); }
  }catch(err){
    state.modal.loading=false;
    state.modal.error='تعذّر توليد السؤال، حاول مجدداً. ('+ (err.message||'خطأ') +')';
  }
  render();
}

function currentTeam(){ return state.teams[state.turn]; }

function renderModal(){
  const m=state.modal;
  const level=LEVELS.find(l=>l.id===m.levelId);
  const cat=m.catId ? CATEGORIES.find(c=>c.id===m.catId) : null;
  if(modalTimerInterval){ clearInterval(modalTimerInterval); modalTimerInterval=null; }
  const overlay=el(`<div class="overlay"></div>`);
  const gate=el(`<div class="gate"></div>`);

  const catLabel = cat ? `${cat.icon} ${cat.name}` : '🎲 يتم اختيار الفئة...';
  const head=el(`<div class="gate-head">
    <span class="gate-tag ${level.id}">${catLabel} · ${level.label} (${level.pts} نقاط)</span>
    <span class="gate-team">الدور: <b>${escapeHtml(currentTeam().name)}</b></span>
  </div>`);
  gate.appendChild(head);

  if(m.loading){
    gate.appendChild(el(`<div class="loader"><span class="spin"></span> جارٍ استحضار السؤال من أعماق المعرفة...</div>`));
    overlay.appendChild(gate);
    return overlay;
  }
  if(m.error){
    gate.appendChild(el(`<div class="err-box">${escapeHtml(m.error)}</div>`));
    const actions=el(`<div class="gate-actions"></div>`);
    const retry=el(`<button class="btn btn-primary btn-sm">إعادة المحاولة</button>`);
    retry.addEventListener('click',()=>{ m.loading=true; m.error=null; render(); loadQuestion(); });
    const close=el(`<button class="btn btn-ghost btn-sm">إغلاق</button>`);
    close.addEventListener('click',closeModalCancel);
    actions.appendChild(close); actions.appendChild(retry);
    gate.appendChild(actions);
    overlay.appendChild(gate);
    return overlay;
  }

  const q=m.question;
  let timerBarEl=null, timerTextEl=null;
  if(!m.answered){
    const timerRow=el(`<div class="timer-row ${level.id}">
      <div class="timer-track"><div class="timer-fill"></div></div>
      <span class="timer-num">${m.timeLeft!=null? m.timeLeft : level.time}</span>
    </div>`);
    timerBarEl = timerRow.querySelector('.timer-fill');
    timerTextEl = timerRow.querySelector('.timer-num');
    const initPct = Math.max(0, Math.min(100, ((m.timeLeft!=null? m.timeLeft : level.time)/level.time)*100));
    timerBarEl.style.width = initPct+'%';
    gate.appendChild(timerRow);
  }
  // lifelines
  const isTF = q.options.length<=2;
  const life=el(`<div class="lifelines"></div>`);
  const team=currentTeam();
  const aiBtn=el(`<button class="life-btn" ${team.life.ai||m.answered?'disabled':''}><span class="ic">🤖</span> اتصال بالذكاء الاصطناعي</button>`);
  aiBtn.addEventListener('click', useAiLifeline);
  const fiftyBtn=el(`<button class="life-btn" ${team.life.fifty||m.answered||isTF?'disabled':''}><span class="ic">✂️</span> حذف إجابتين</button>`);
  if(isTF) fiftyBtn.title='غير متاح لأسئلة صح/خطأ';
  fiftyBtn.addEventListener('click', useFiftyLifeline);
  const hintBtn=el(`<button class="life-btn" ${team.life.hint||m.answered?'disabled':''}><span class="ic">💡</span> تلميح</button>`);
  hintBtn.addEventListener('click', useHintLifeline);
  life.appendChild(aiBtn); life.appendChild(fiftyBtn); life.appendChild(hintBtn);
  gate.appendChild(life);

  gate.appendChild(el(`<div class="qtext">${escapeHtml(q.question)}</div>`));

  if(m.hintText){
    gate.appendChild(el(`<div class="hint-box">💡 ${escapeHtml(m.hintText)}</div>`));
  }
  if(m.aiLoading){
    gate.appendChild(el(`<div class="loader"><span class="spin"></span> الاتصال جارٍ بصديقك الذكي...</div>`));
  }
  if(m.aiText){
    gate.appendChild(el(`<div class="ai-box">🤖 ${escapeHtml(m.aiText)}</div>`));
  }

  const opts=el(`<div class="options ${isTF?'tf-options':''}"></div>`);
  const tfIcons = ['✅','❌'];
  q.options.forEach((optText,i)=>{
    const isHidden = m.hiddenOpts.includes(i);
    const cls=['opt'];
    if(isTF) cls.push('opt-tf');
    if(isHidden) cls.push('hidden50');
    if(m.answered){
      cls.push('disabled');
      if(i===q.correct_index) cls.push('correct-reveal');
      else if(i===m.chosenIdx) cls.push('wrong-reveal');
    }
    const labelHtml = isTF ? `<span class="lab tf-lab">${tfIcons[i]||''}</span>` : `<span class="lab">${OPT_LABELS[i]}</span>`;
    const optEl=el(`<div class="${cls.join(' ')}">${labelHtml}<span>${escapeHtml(optText)}</span></div>`);
    if(!m.answered && !isHidden){
      optEl.addEventListener('click',()=> chooseAnswer(i));
    }
    opts.appendChild(optEl);
  });
  gate.appendChild(opts);

  if(m.answered){
    const correct = m.chosenIdx===q.correct_index;
    const strip=el(`<div class="result-strip ${correct?'good':'bad'}"></div>`);
    if(correct){
      strip.innerHTML=`<span>✅ إجابة صحيحة!</span><span>+${level.pts} نقطة</span>`;
    } else {
      const pen = level.penalty;
      const label = m.timedOut ? '⏰ انتهى الوقت' : (m.chosenIdx===null?'⏭️ لم تتم الإجابة':'❌ إجابة خاطئة');
      strip.innerHTML=`<span>${label}</span><span>${pen>0? '-'+pen+' نقطة':'بلا خصم'}</span>`;
    }
    gate.appendChild(strip);
    const actions=el(`<div class="gate-actions"></div>`);
    const nextBtn=el(`<button class="btn btn-gold">متابعة ←</button>`);
    nextBtn.addEventListener('click', closeModalAndAdvance);
    actions.appendChild(nextBtn);
    gate.appendChild(actions);
  } else {
    const actions=el(`<div class="gate-actions"></div>`);
    const skipBtn=el(`<button class="btn btn-ghost btn-sm">تخطي بلا إجابة</button>`);
    skipBtn.addEventListener('click',()=> chooseAnswer(null));
    actions.appendChild(skipBtn);
    gate.appendChild(actions);
  }

  overlay.appendChild(gate);

  if(!m.answered && timerBarEl && timerTextEl){
    startModalTimer(level, timerBarEl, timerTextEl);
  }

  return overlay;
}

let modalTimerInterval = null;
function startModalTimer(level, timerBarEl, timerTextEl){
  modalTimerInterval = setInterval(()=>{
    const m = state.modal;
    if(!m || m.answered){ clearInterval(modalTimerInterval); modalTimerInterval=null; return; }
    m.timeLeft = Math.max(0, (m.timeLeft==null? level.time : m.timeLeft) - 1);
    const pct = Math.max(0, Math.min(100, (m.timeLeft/level.time)*100));
    timerBarEl.style.width = pct+'%';
    timerTextEl.textContent = m.timeLeft;
    if(m.timeLeft<=5){ timerBarEl.classList.add('urgent'); timerTextEl.classList.add('urgent'); }
    if(m.timeLeft<=0){
      clearInterval(modalTimerInterval); modalTimerInterval=null;
      m.timedOut = true;
      chooseAnswer(null);
    }
  }, 1000);
}

function useFiftyLifeline(){
  const m=state.modal; const team=currentTeam();
  if(team.life.fifty || m.answered || m.question.options.length<=2) return;
  team.life.fifty=true;
  const wrongIdx = m.question.options.map((_,i)=>i).filter(i=>i!==m.question.correct_index);
  shuffleArr(wrongIdx);
  m.hiddenOpts = wrongIdx.slice(0,2);
  render();
}
function useHintLifeline(){
  const m=state.modal; const team=currentTeam();
  if(team.life.hint || m.answered) return;
  team.life.hint=true;
  m.hintText = m.question.hint || 'لا يتوفر تلميح لهذا السؤال.';
  render();
}
async function useAiLifeline(){
  const m=state.modal; const team=currentTeam();
  if(team.life.ai || m.answered) return;
  team.life.ai=true;
  m.aiLoading=true;
  render();
  try{
    m.aiText = await getAiHelpText(m.question);
  }catch(err){
    m.aiText = 'تعذّر الاتصال بالمساعد الآن، حاول الاعتماد على معرفتك!';
  }
  m.aiLoading=false;
  render();
}

function chooseAnswer(idx){
  const m=state.modal;
  if(m.answered) return;
  m.answered=true;
  m.chosenIdx=idx;
  const level=LEVELS.find(l=>l.id===m.levelId);
  const team=currentTeam();
  let delta=0;
  if(idx===m.question.correct_index){ delta=level.pts; }
  else { delta = -level.penalty; }
  team.score += delta;
  team.remaining[m.levelId] = Math.max(0, team.remaining[m.levelId]-1);
  if(!state.history) state.history=[];
  state.history.push({catId:m.catId, levelId:m.levelId, delta, teamIdx: state.turn});
  render();
}

function closeModalAndAdvance(){
  if(modalTimerInterval){ clearInterval(modalTimerInterval); modalTimerInterval=null; }
  state.modal=null;
  if(allUsed()){ state.screen='end'; render(); return; }
  let next = (state.turn+1) % state.teams.length;
  let guard=0;
  while(teamRemainingTotal(state.teams[next])<=0 && guard<state.teams.length){
    next = (next+1) % state.teams.length;
    guard++;
  }
  state.turn = next;
  render();
}
function closeModalCancel(){
  if(modalTimerInterval){ clearInterval(modalTimerInterval); modalTimerInterval=null; }
  state.modal=null; render();
}

/* ============================ END SCREEN ============================ */
function renderEnd(){
  const wrap=el(`<div class="panel"></div>`);
  const ranked=[...state.teams].sort((a,b)=>b.score-a.score);
  wrap.appendChild(el(`<div class="section-title" style="text-align:center">🏁 انتهت المنافسة!</div>`));
  wrap.appendChild(el(`<div class="section-sub" style="text-align:center">إليكم أبطال حلبة الأساطير</div>`));

  const podium=el(`<div class="podium"></div>`);
  const top3=ranked.slice(0,3);
  const crowns=['👑','🥈','🥉'];
  const classes=['p1','p2','p3'];
  top3.forEach((t,i)=>{
    podium.appendChild(el(`<div class="pod ${classes[i]}">
      <div class="crown">${crowns[i]}</div>
      <div class="nm">${escapeHtml(t.name)}</div>
      <div class="sc">${t.score}</div>
    </div>`));
  });
  wrap.appendChild(podium);

  if(ranked.length>3){
    const list=el(`<div style="margin-top:18px"></div>`);
    ranked.slice(3).forEach((t,i)=>{
      list.appendChild(el(`<div class="rank-row"><span class="l">#${i+4} ${escapeHtml(t.name)}</span><span>${t.score}</span></div>`));
    });
    wrap.appendChild(list);
  }

  const actions=el(`<div class="wizard-nav" style="justify-content:center; margin-top:24px"></div>`);
  const again=el(`<button class="btn btn-primary">🔄 لعبة جديدة</button>`);
  again.addEventListener('click',()=>{
    state = {screen:'setupTeams', teams:state.teams.map(t=>({name:t.name, score:0})), selectedCats:state.selectedCats, questionCounts:{...state.questionCounts}, turn:0, usedQuestionsByCat:{}, history:[], modal:null};
    render();
  });
  actions.appendChild(again);
  wrap.appendChild(actions);
  return wrap;
}

/* ============================ UTIL ============================ */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

render();
</script>
